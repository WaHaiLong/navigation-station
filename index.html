<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航站 - 我的主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sites-container" id="sitesContainer">
            <!-- 网站卡片将通过JavaScript动态生成 -->
        </div>

        <div class="add-section">
            <div class="action-buttons">
                <button id="toggleAddBtn" class="btn btn-secondary">添加网站</button>
                <button id="settingsBtn" class="btn btn-secondary">⚙️ 设置</button>
                <span id="syncStatus" class="sync-status"></span>
            </div>
            <div id="addForm" class="add-form hidden">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="nameInput" 
                        placeholder="网站名称"
                        autocomplete="off"
                    >
                    <input 
                        type="text" 
                        id="urlInput" 
                        placeholder="网址，例如：https://www.example.com"
                        autocomplete="off"
                    >
                    <button id="addBtn" class="btn btn-primary">添加</button>
                </div>
            </div>
            <div id="settingsForm" class="add-form hidden">
                <div class="settings-content">
                    <h3>GitHub Gist 同步设置</h3>
                    <p class="settings-desc">使用 GitHub Gist 可以在不同浏览器间同步数据</p>
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="githubTokenInput" 
                            placeholder="GitHub Personal Access Token"
                            autocomplete="off"
                        >
                        <button id="saveTokenBtn" class="btn btn-primary">保存Token</button>
                    </div>
                    <div class="input-group" style="margin-top: 10px;">
                        <button id="syncFromGistBtn" class="btn btn-secondary">从云端同步</button>
                        <button id="syncToGistBtn" class="btn btn-secondary">同步到云端</button>
                        <button id="clearTokenBtn" class="btn btn-danger">清除Token</button>
                    </div>
                    <div id="gistStatus" class="gist-status"></div>
                    <div class="help-text">
                        <p><strong>如何获取 Token：</strong></p>
                        <ol>
                            <li>访问 <a href="https://github.com/settings/tokens" target="_blank">GitHub Settings → Developer settings → Personal access tokens</a></li>
                            <li>点击 "Generate new token (classic)"</li>
                            <li>勾选 <code>gist</code> 权限</li>
                            <li>生成并复制 Token</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
